<!doctype html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and description are overridden at startup by main.tsx using BRAND config;
         the values below are just loading-time placeholders. -->
    <title>ArcReel · Agent 驱动的 AI 视频创作工作台</title>
    <meta name="description" content="AI 视频创作工作台，统一管理项目、脚本、分镜、视频生成与 Agent 对话。" />
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Boot splash: rendered before the JS bundle/CSS arrive so slow starts never show a blank screen.
         React replaces #app-root's children on mount. -->
    <style>
      #app-root { min-height: 100vh; background: #14151c; }
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #8b8fa3;
        font-family: "Inter Variable", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .boot-splash__logo {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #c4b5fd;
      }
      .boot-splash__bar {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      .boot-splash__bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #8b5cf6, #c4b5fd);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
    </style>
</head>
<body>
    <div id="app-root">
      <div class="boot-splash" role="status" aria-live="polite" aria-label="Loading ArcReel">
        <div class="boot-splash__logo">ArcReel</div>
        <div class="boot-splash__bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
